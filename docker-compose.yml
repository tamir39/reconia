services:
  db:
    image: postgres:16-alpine
    container_name: reconia-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconia}
      POSTGRES_DB: ${POSTGRES_DB:-reconia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reconia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: reconia-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconia}
      POSTGRES_DB: ${POSTGRES_DB:-reconia}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  reconia-pgdata:
